<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>MUST Graduates 2017 Trust Fund</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070707; --panel:#14110c; --card:#1c1810; --line:#8a7330;
  --gold:#f5d15a; --gold2:#fff1b0; --ink:#fffaf0; --muted:#f0e2b8;
  --green:#4ae39a; --green-dim:#163526; --red:#ff7a6b; --red-dim:#3a1612;
  --amber:#ffd36a; --amber-dim:#3a2e12; --teal:#25d366;
}
html[data-theme="light"]{
  --bg:#efe6cf; --panel:#fffdf8; --card:#fffaf0; --line:#8a7330;
  --gold:#7a5a00; --gold2:#3d2a00; --ink:#120e08; --muted:#3f3418;
  --green:#0d6b3c; --green-dim:#d7f3e4; --red:#a61b12; --red-dim:#fde7e4;
  --amber:#7a5000; --amber-dim:#ffefc2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Cormorant Garamond",Georgia,serif}
.app{max-width:1180px;margin:0 auto;padding:18px 16px 72px}
.top{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:18px 20px;background:
  radial-gradient(800px 200px at 10% -20%, rgba(212,175,55,.18), transparent),
  linear-gradient(180deg,#161616,#101010);border:1px solid #2c2618;border-radius:22px}
.cine{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:22px;background:#070707;pointer-events:none}
.cine video,.cine img{position:absolute;left:0;right:0;top:-18%;width:100%;height:140%;object-fit:cover;object-position:center 62%;filter:saturate(1.12) contrast(1.12) brightness(.72);pointer-events:none}
.cine img.cine-still{opacity:.55;animation:cineKen 22s ease-in-out infinite alternate}
.cine video{opacity:0;transition:opacity .7s ease;pointer-events:none}
.cine video.is-on{opacity:.55}
.cine img.cine-still.is-dim{opacity:.12}
.cine::after{content:"";position:absolute;inset:0;pointer-events:auto;background:linear-gradient(90deg,rgba(7,7,7,.88) 0%,rgba(7,7,7,.55) 34%,rgba(7,7,7,.22) 58%,rgba(7,7,7,.82) 100%)}
@keyframes cineKen{0%{transform:scale(1.02)}100%{transform:scale(1.1)}}
.top>.row,.top .brand,.top .crest,.top .mode,.top .gear{position:relative;z-index:2}
.brand h1{color:#fff3c4!important;text-shadow:0 2px 12px #000,0 0 8px #000}
.brand p{color:#fff!important;text-shadow:0 2px 10px #000,0 0 6px #000}
.crest{width:78px;height:78px;flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:end center;z-index:60;padding:10px 10px calc(12px + env(safe-area-inset-bottom));}
.modal .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 12px 12px;padding:16px 16px 22px;max-width:720px;width:100%;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch}
.modal .box h3,.modal .box label,.modal .box p{color:var(--ink)}
.modal .box label{opacity:.85}
@media(min-width:700px){.modal{place-items:center}}
html[data-theme="light"] .modal .box{background:#fffdf8;color:#120e08}
html[data-theme="light"] .modal .box h3{color:#3d2a00}
html[data-theme="light"] .card h3{color:#3d2a00}
html[data-theme="light"] .brand h1{color:#fff1b0}

.chart{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin:4px 0}
.dot{width:10px;height:10px;border-radius:50%}
.photo{width:72px;height:72px;border-radius:12px;object-fit:cover;border:2px solid var(--gold);background:#111}
/* flyer — sized for one A4 landscape sheet */
.flyer-wrap{background:#f5c400;padding:8px}
.flyer{background:#0a0a0a;color:#fff;border:3px solid #d4af37;padding:8px 8px;font-size:12px}
.flyer h2{margin:0;text-align:center;color:#f5c400;font-size:20px;letter-spacing:.03em;line-height:1.1}
.flyer .sub{text-align:center;color:#eee;margin:4px 0 6px;font-size:11px;line-height:1.25}
.flyer .email-pill{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.flyer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.flyer table{width:100%;border-collapse:collapse;table-layout:fixed;background:#f5e6a8;color:#111}
.flyer th{background:#111;color:#fff;font-size:10px;padding:3px 4px;letter-spacing:.04em}
.flyer td{padding:2px 4px;border-bottom:1px solid #e0d08a;font-size:11px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flyer td:first-child,.flyer th:first-child{width:28px}
.flyer td:last-child,.flyer th:last-child{width:78px;text-align:right}
.flyer .bar{background:#111;color:#f5c400;text-align:center;padding:6px 6px;margin-top:6px;font-weight:800;font-size:13px;line-height:1.25}
.flyer .legend-box{background:#fff;color:#111;padding:6px 8px;margin-top:6px;font-size:11px;line-height:1.3;font-weight:700}
.brand h1{margin:0;font-size:clamp(1.35rem,3vw,2rem);color:var(--gold2);letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.mode{display:flex;background:#000;border:1px solid #333;border-radius:999px;overflow:hidden}
.mode button{border:0;background:transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer}
.mode button.on{background:var(--gold);color:#111;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:1.35rem;color:var(--gold2);text-shadow:0 1px 0 #000}
.stat span{color:#fff3c8;font-size:.8rem;font-weight:600}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.nav button,.btn{border:1px solid #3a3322;background:#1c1c1c;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.nav button.on,.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.btn.ghost{background:transparent}
.btn.wa{background:#128C7E;border-color:#128C7E;color:#fff;text-decoration:none;display:inline-block}
.btn.danger{background:var(--red);border-color:var(--red);color:#111;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 10px;color:var(--gold2)}
label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.ok{background:var(--green-dim);color:var(--green)}
.wait{background:var(--amber-dim);color:var(--amber)}
.no{background:var(--red-dim);color:var(--red)}
.offp{background:#222;color:#888}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:.9rem;vertical-align:top}
th{color:var(--gold);font-weight:600;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
.progress{height:8px;background:#2a2a2a;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.chatlog{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bubble{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
.bubble.official{border-color:#3a3322}
.bubble small{color:var(--muted)}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.officials{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.off-card{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:12px}
.off-card b{display:block;color:var(--gold2)}
.flyer-wrap{background:#111;padding:10px}
.best{background:#3a2e12;color:#f3e2a5;text-align:center;padding:8px;margin:8px 0;font-weight:700;border:1px solid #d4af37}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--gold);background:#1a1408;border-radius:10px;padding:10px 0;margin-top:12px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite;color:var(--gold2);font-weight:700;font-size:.95rem}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.hero{display:none;grid-template-columns:1fr 160px;gap:12px;align-items:center;margin:12px 0}
.hero.show{display:grid}
@media(max-width:800px){
  .hero.show{grid-template-columns:1fr 120px}
}
.money-slide{position:relative;min-height:92px}
.money-slide .stat{display:none}
.money-slide .stat.on{display:block}
#heroPie svg path{opacity:.28;transition:opacity .4s}
#heroPie svg path.hot{opacity:1}
.asof{text-align:center;color:#efe0b0;font-size:.8rem;margin:4px 0 8px}
.credits{height:220px;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:10px}
.credits-inner{animation:roll 18s linear infinite}
.credits table{margin:0}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.gate{min-height:70vh;display:grid;place-items:center;padding:24px}
.gate-box{width:min(460px,100%);background:var(--panel);border:1px solid #2c2618;border-radius:24px;padding:28px;text-align:center}
.hidden{display:none}
footer{text-align:center;color:var(--ink);font-size:.9rem;margin-top:18px;padding:14px 10px 22px;border-top:1px solid var(--line)}
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer}
.menu-pop{position:absolute;right:16px;top:86px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:30;min-width:230px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.eye{border:0;background:transparent;cursor:pointer;font-size:1.1rem}
html[data-font="sm"]{font-size:14px}
html[data-font="md"]{font-size:16px}
html[data-font="lg"]{font-size:18px}
html[data-font="xl"]{font-size:20px}
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{background:#fff;color:#120e08;border-color:#8a7330}
html[data-theme="light"] .card,html[data-theme="light"] .stat,html[data-theme="light"] .bubble{background:#fffaf0;color:#120e08}
html[data-theme="light"] .brand h1,.brand p{text-shadow:0 2px 10px rgba(0,0,0,.55)}
.sticky-exp{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.sticky-exp table{margin:0}
.sticky-exp thead th{position:sticky;top:0;background:#111;color:#f5d15a;z-index:2}
html[data-theme="light"] .sticky-exp thead th{background:#3d2a00;color:#fff1b0}
.pay-pill{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;margin:6px 6px 0 0;cursor:pointer;font-weight:700;border:0}
.pay-row{display:flex;gap:12px;flex-wrap:nowrap;justify-content:center;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.pay-logo{flex:0 0 92px;width:92px;height:92px;background:transparent;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px}
.pay-logo img{width:92px;height:92px;object-fit:contain;display:block}
.pay-logo.cover img{object-fit:cover}
.pay-logo.on-white{background:#fff;border-radius:18px}

.pay-logo span{font-size:.72rem;color:#111;font-weight:700;text-align:center}

.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#666;vertical-align:middle}
.live-dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.live-dot.off{background:#e11d48;box-shadow:0 0 8px #e11d48}
.live-n{margin-left:8px;font-size:.9rem;color:var(--ink);vertical-align:middle;font-weight:700}
.name-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-height:280px;overflow:auto}
.name-pick{font-size:.85rem}
.name-hints{margin-top:8px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#0f0f0f}
.name-hints:empty{display:none}
.name-hint{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #2a2a2a;color:var(--ink);padding:14px 14px;min-height:48px;font:inherit;cursor:pointer;-webkit-tap-highlight-color:rgba(245,209,90,.25)}
.name-hint:last-child{border-bottom:0}
.exp-head{background:#111;color:#f5d15a;font-weight:700;padding:8px 12px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem}
.exp-tick{border-radius:0 0 10px 10px;height:180px}
.exp-row{padding:8px 12px;border-bottom:1px solid #2a2a2a;font-size:.9rem}

.exp-grid{display:grid;grid-template-columns:110px 1fr 120px 110px;gap:8px;align-items:center;padding:8px 12px}
.exp-tick .exp-grid{border-bottom:1px solid #2a2a2a}
.date-pick{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0}
.date-pick label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.date-wrap{display:flex;align-items:center;gap:6px}
.date-wrap input[type=date]{min-width:160px;min-height:42px;font-size:1rem;padding:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.cal-btn{min-width:42px;min-height:42px;font-size:1.2rem;border-radius:10px}
.pay-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.kebab{min-width:36px;font-size:1.25rem;line-height:1}
.kebab-pop{position:absolute;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:160px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.kebab-pop button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:8px 10px;font:inherit;cursor:pointer;border-radius:8px}
.kebab-pop button:hover{background:#2a2a2a}
.kebab-pop button.danger{color:var(--red)}

.new-red{color:#ff4d3a;font-weight:700}

@media(max-width:800px){
  .stats{grid-template-columns:1fr 1fr}
  .flyer-grid{grid-template-columns:1fr 1fr}
  .exp-grid{grid-template-columns:22% 32% 22% 24%;gap:4px;padding:6px 4px;font-size:.72rem}
  .exp-head{font-size:.65rem;padding:8px 4px}
  .sticky-exp{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sticky-exp table{min-width:560px;font-size:.78rem}
  .sticky-exp th,.sticky-exp td{padding:6px 4px;white-space:nowrap}
  .nav button,.btn{padding:7px 10px;font-size:.82rem}
}
@media print{
  .noprint,.top .mode,.nav,footer,.stats{display:none!important}
  body,.app{background:#fff;color:#000;padding:0;margin:0}
  .flyer-wrap{background:#fff;padding:0}
  .flyer{page-break-inside:avoid}
}

.live-wrap{display:flex;flex-direction:column;height:min(52vh,460px);background:#0b141a;border:1px solid #1f3b4d;border-radius:16px;overflow:hidden;position:relative}
.live-wrap.max{height:min(88vh,820px)}
.live-wrap.min{height:64px}
.live-wrap.min .live-stream,.live-wrap.min .live-tools,.live-wrap.min .live-composer,.live-wrap.min .live-jump,.live-wrap.min .live-pin,.live-wrap.min .live-search{display:none}
.live-sz{background:transparent;border:0;color:#e9edef;font-size:1.15rem;cursor:pointer;padding:2px 6px;line-height:1}
.live-menu{display:flex;gap:6px;background:#1f2c34;border-radius:20px;padding:4px 8px;margin-top:4px}
.live-menu button{background:#2a3942;border:0;color:#e9edef;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer}
.live-emos{display:flex;gap:4px;margin-top:2px}
.live-emos button{background:transparent;border:0;font-size:1.05rem;cursor:pointer;padding:0 2px}
.live-row.on .live-b{outline:1px solid #00a884}

.live-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#1f2c34;border-bottom:1px solid #2a3942}
.live-top b{color:#e9edef;font-size:.95rem}
.live-top small{color:#8696a0}
.live-stream{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:#0b141a}
.live-row{display:flex;flex-direction:column;max-width:86%}
.live-row.me{align-self:flex-end;align-items:flex-end}
.live-row.them{align-self:flex-start;align-items:flex-start}
.live-b{padding:7px 10px 4px;border-radius:8px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.live-row.me .live-b{background:#005c4b;color:#e9edef;border-top-right-radius:2px}
.live-row.them .live-b{background:#202c33;color:#e9edef;border-top-left-radius:2px}
.live-who{font-size:.68rem;color:#53bdeb;font-weight:700;margin-bottom:2px}
.live-tx{white-space:pre-wrap;word-break:break-word;font-size:.95rem;line-height:1.35}
.live-meta{display:flex;justify-content:flex-end;gap:6px;align-items:center;margin-top:3px;font-size:.65rem;color:#8696a0}
.live-reply{border-left:3px solid #00a884;background:rgba(0,0,0,.18);padding:4px 8px;margin:0 0 6px;border-radius:4px;font-size:.78rem;color:#d1d7db}
.live-acts{display:flex;gap:6px;margin-top:2px;font-size:.75rem}
.live-acts button{background:transparent;border:0;color:#8696a0;cursor:pointer;padding:2px}
.live-reacts{margin-top:2px;font-size:.8rem}
.live-composer{display:flex;gap:8px;align-items:flex-end;padding:8px;background:#1f2c34}
.live-composer textarea{flex:1;min-height:42px;max-height:120px;background:#2a3942;border:0;color:#e9edef;border-radius:22px;padding:10px 14px;resize:none}
.live-send{width:44px;height:44px;border-radius:50%;border:0;background:#00a884;color:#fff;font-size:1.1rem;cursor:pointer;flex:none}
.live-pin{background:#182229;color:#ffd36a;padding:6px 10px;font-size:.8rem;border-bottom:1px solid #2a3942}
.chat-ctl label{margin-top:6px}
.live-tools{display:flex;gap:4px;padding:0 8px 6px;background:#1f2c34}
.live-tools button,.live-tools label.tool{background:#2a3942;border:0;color:#e9edef;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
.live-media img,.live-media video{max-width:220px;border-radius:8px;display:block}
.live-media audio{width:210px}
.live-dl{color:#53bdeb;font-size:.78rem}
.rec-on{background:#e11d48!important}
.ticks{font-size:.8rem;letter-spacing:-1px;line-height:1;margin-left:4px}
.ticks.one,.ticks.two{color:#8696a0}
.ticks.blue{color:#53bdeb}
.live-day{align-self:center;background:#182229;color:#8696a0;font-size:.72rem;padding:4px 10px;border-radius:8px;margin:8px 0}
.live-fwd{font-size:.68rem;color:#8696a0;font-style:italic;margin-bottom:2px}
.live-star{color:#ffd36a}
.live-jump{position:absolute;right:14px;bottom:70px;width:36px;height:36px;border-radius:50%;border:0;background:#00a884;color:#fff;cursor:pointer}
.live-wrap{position:relative}
.live-search{width:42%;background:#2a3942;border:0;color:#e9edef;border-radius:16px;padding:6px 10px;font-size:.8rem}




</style>
</head>
<body>
<div class="app">
  <div class="top">

function load(){
  try{
    const keys=[KEY,"must2017trust.v4","must2017trust.v3","must2017trust.v2","must2017trust.v1"];
    let raw=null;
    for(const k of keys){ raw=localStorage.getItem(k); if(raw) break; }
    if(raw){
      const db=JSON.parse(raw);
      db.settings = Object.assign(defaultSettings(), db.settings||{});
      db.notices = db.notices||[];
      db.resets = db.resets||[];
      db.pending = db.pending||[];
      if(!db.pin) db.pin="2017";
      (db.members||[]).forEach(m=>{ m.profile=m.profile||{spouse:"",father:"",mother:"",guardian:"",siblings:[],phone2:"",submitted:false}; });
      (db.expenses||[]).forEach(e=>{ if(e.seen===undefined) e.seen=true; });
      localStorage.setItem(KEY, JSON.stringify(db));
      return db;
    }
  }catch(e){}
  return seed();
}

function listenCloud(){
  if(!FB.db) return;
  if(FB.unsub) FB.unsub();
  FB.unsub=FB.db.collection("ledger").doc("main").onSnapshot(snap=>{
    if(FB.pushing) return;
    if(!snap.exists) return;
    const cloud=snap.data()||{};
    const incoming=cloud.db;
    if(!incoming || !incoming.members) return;
    const cat=Number(cloud.updatedAt||0);
    const lat=Number(DB.updatedAt||0);
    if(cat && lat && cat<=lat) return;
    FB.skip=true;
    incoming.settings=Object.assign(defaultSettings(), incoming.settings||{});
    incoming.notices=incoming.notices||[];
    incoming.resets=incoming.resets||[];
    incoming.pending=incoming.pending||[];
    incoming.expenses=incoming.expenses||[];
    incoming.chat=incoming.chat||[];
    incoming.updatedAt=cat||Date.now();
    DB=incoming;
    localStorage.setItem(KEY, JSON.stringify(DB));
    FB.at=cat; FB.skip=false;
    if(typeof render==="function") try{ render(); }catch(e){}
  }, err=>{ FB.err=err.message||String(err); FB.ok=false; });
}
function pushCloud(){
  if(!FB.db || FB.skip) return;
  if(!FB.user){ FB.err="sign-in"; return; }
  DB.updatedAt=Date.now();
  FB.pushing=true;
  FB.db.collection("ledger").doc("main").set({
    db: cloudPayload(),
    updatedAt: DB.updatedAt,
    note:"MUST 2017 trust fund"
  }).then(()=>{ FB.at=DB.updatedAt; FB.err="";
      let ch=false;
      (DB.live||[]).forEach(m=>{
        if(m.status==="sent" || !m.status){ m.status="delivered"; ch=true; }
      });
      if(ch) try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
    }).catch(e=>{ FB.err=e.message||String(e); }).finally(()=>{ FB.pushing=false; });

function monthsBetween(from, to){
  return (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth()) + 1;
}
function billThroughDate(now){
  const s=DB.settings||defaultSettings();
  if(s.paused && s.pauseFrom){
    const p=new Date(s.pauseFrom+"T00:00:00");
    if(p<now) return p;
  }
  return now;
}
function monthsElapsed(now){ return Math.max(0, monthsBetween(START, now||new Date())); }
function classify(m, now){
  now=now||new Date();
  const elapsed=monthsElapsed(now);
  const expectedNow=elapsed*MONTHLY;
  const paid=Number(m.paid||0);
  const remaining=Math.max(0, expectedNow-paid);
  const prepaid=Math.max(0, paid-expectedNow);
  const monthsBehind=Math.ceil(remaining/MONTHLY);
  const monthsAhead=Math.floor(prepaid/MONTHLY);
  if(!m.active) return {code:"inactive",label:"Not registered",remaining:expectedNow,monthsBehind:elapsed,expectedNow,prepaid:0,monthsAhead:0};
  if(remaining<=0) return {code:"ok",label:monthsAhead?("Entitled · prepaid "+monthsAhead+" mo"):"Entitled · up to date",remaining:0,monthsBehind:0,expectedNow,prepaid,monthsAhead};
  if(monthsBehind<=GRACE) return {code:"wait",label:"Entitled · in grace",remaining,monthsBehind,expectedNow,prepaid:0,monthsAhead:0};
  return {code:"no",label:"Not entitled",remaining,monthsBehind,expectedNow,prepaid:0,monthsAhead:0};
}
function ugx(n){ return Number(n||0).toLocaleString("en-UG"); }
function digitsPhone(phone){ return String(phone||"").replace(/\D/g,""); }
function waPhone(phone){
  let d=digitsPhone(phone);
  if(!d) return "";
  if(d.startsWith("2560")) d="256"+d.slice(4);
  else if(d.startsWith("0") && d.length>=9) d="256"+d.slice(1);
  else if(d.startsWith("256")) d=d;
  else if(d.length===9 && d[0]==="7") d="256"+d;
  else if(d.length===10 && d[0]==="7") d="256"+d.slice(0,9);
  return d;
}
function wa(phone,text){
  const d=waPhone(phone);
  if(!d) return "";
  return "https://wa.me/"+d+"?text="+encodeURIComponent(text||"");
}
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function tagMsg(t){
  t=(t||"").toLowerCase();
  if(/pay|balanc|contribut|ugx|behind|clear|remain/.test(t)) return "payment";
  if(/benefit|burial|wedding|entitle|funeral/.test(t)) return "benefit";
  if(/complain|not recorded|missing|wrong|delay|late/.test(t)) return "complaint";
  return "social";
}

function findMembers(q){
  q=(q||"").trim().toLowerCase();
  const digits=q.replace(/\D/g,"");
  return DB.members.filter(m=>{
    const n=(m.name||"").toLowerCase();
    if(!q) return false;
    if(n===q || n.indexOf(q)>=0) return true;
    const ph=String(m.phone||"").replace(/\D/g,"");
    if(digits.length>=4 && ph.endsWith(digits)) return true;
    if((m.code||"").toLowerCase()===q) return true;
    return false;
  });
}

function pieSvg(collected,spent,due){
  const t=Math.max(1,collected+spent+due);
  const a1=collected/t, a2=spent/t, a3=due/t;
  function arc(start,frac,color){
    const s=start*2*Math.PI-Math.PI/2, e=(start+frac)*2*Math.PI-Math.PI/2;
    const x1=50+40*Math.cos(s), y1=50+40*Math.sin(s);
    const x2=50+40*Math.cos(e), y2=50+40*Math.sin(e);
    const large=frac>0.5?1:0;
    return `<path d="M50 50 L${x1} ${y1} A40 40 0 ${large} 1 ${x2} ${y2} Z" fill="${color}"/>`;
  }
  return `<div class="chart"><svg width="120" height="120" viewBox="0 0 100 100">${arc(0,a1,"#d4af37")}${arc(a1,a2,"#ff6b5a")}${arc(a1+a2,a3,"#3dd68c")}</svg>
    <div class="legend">
      <span><i class="dot" style="background:#d4af37"></i> Collected ${ugx(collected)}</span>
      <span><i class="dot" style="background:#ff6b5a"></i> Spent ${ugx(spent)}</span>
      <span><i class="dot" style="background:#3dd68c"></i> Still to collect ${ugx(due)}</span>
    </div></div>`;
}
function miniPie(collected,due,spent,bal){
  const parts=[
    {v:Math.max(0,collected),c:"#d4af37"},
    {v:Math.max(0,due),c:"#3dd68c"},
    {v:Math.max(0,spent),c:"#ff6b5a"},
    {v:Math.max(0,bal),c:"#60a5fa"}
  ];
  const t=parts.reduce((s,p)=>s+p.v,0)||1;
  let a=0, d="";
  parts.forEach((p,i)=>{
    const f=p.v/t, s=a*2*Math.PI-Math.PI/2, e=(a+f)*2*Math.PI-Math.PI/2;
    const x1=50+40*Math.cos(s), y1=50+40*Math.sin(s);
    const x2=50+40*Math.cos(e), y2=50+40*Math.sin(e);
    d+=`<path class="${i===0?'hot':''}" data-i="${i}" d="M50 50 L${x1} ${y1} A40 40 0 ${f>0.5?1:0} 1 ${x2} ${y2} Z" fill="${p.c}"/>`;
    a+=f;
  });
  const pcts=parts.map(p=>Math.round(p.v/t*100));
  window._piePcts=pcts;
  return `<svg width="130" height="130" viewBox="0 0 100 100">${d}<circle cx="50" cy="50" r="22" fill="#0b0b0b"/>
    <text id="piePct" x="50" y="53" text-anchor="middle" fill="#f3e2a5" font-size="10" font-weight="700">${pcts[0]}%</text></svg>`;
}

    cards.forEach(c=>c.classList.remove("on"));
    window._moneyI=(window._moneyI+1)%cards.length;

  },2000);
}

function openFile(blob, filename){

  const a=document.createElement("a");
  a.href=url; a.download=filename; a.target="_blank"; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  const w=window.open(url,"_blank");
  if(!w){
    const viewer=window.open("","fileview");
    if(viewer) viewer.location.href=url;
    else location.href=url;
  }
}
function htmlToOpen(html, filename){
  const pdfName=filename.replace(/\.html$/i,".pdf");
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  wrap.style.cssText="position:fixed;left:-9999px;top:0;background:#fff;color:#111;width:760px";
  document.body.appendChild(wrap);
  const finishBlob=blob=>{ wrap.remove(); openFile(blob, pdfName); };
  const fail=()=>{ wrap.remove(); openFile(new Blob([html],{type:"text/html"}), filename); };
  const JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(window.html2canvas && JsPDF){
    window.html2canvas(wrap.firstElementChild||wrap,{scale:2,backgroundColor:"#ffffff",useCORS:true}).then(canvas=>{
      const pdf=new JsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      const pw=pdf.internal.pageSize.getWidth();
      const ph=pdf.internal.pageSize.getHeight();
      const pad=10;
      let w=pw-pad*2, h=w*canvas.height/canvas.width;
      if(h>ph-pad*2){ h=ph-pad*2; w=h*canvas.width/canvas.height; }
      pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",pad,pad,w,h);
      finishBlob(pdf.output("blob"));
    }).catch(fail);
    return;
  }
  if(typeof html2pdf!=="undefined"){
    html2pdf().set({
      margin:10, filename:pdfName,
      image:{type:"jpeg",quality:0.98},
      html2canvas:{scale:2,backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
    }).from(wrap.firstElementChild||wrap).outputPdf("blob").then(finishBlob).catch(fail);
    return;
  }
  fail();
}

function monthKeys(now){
  now=now||new Date();
  const out=[];
  let y=START.getFullYear(), m=START.getMonth();
  while(y<now.getFullYear() || (y===now.getFullYear() && m<=now.getMonth())){
    const d=new Date(y,m,1);
    out.push({key:d.getFullYear()+"-"+String(m+1).padStart(2,"0"), label:d.toLocaleString("en",{month:"long",year:"numeric"})});
    m++; if(m===12){ m=0; y++; }
  }
  return out;
}
function memberLines(m){
  const lines=[];
  if(m.fee) lines.push({at:"2025-01",type:"Membership fee",amount:m.fee,due:m.fee,ok:true});
  let pool=Number(m.paid||0);
  monthKeys().forEach(k=>{
    const take=Math.min(MONTHLY, Math.max(0,pool));
    pool-=take;
    lines.push({at:k.key,type:k.label,amount:take,due:MONTHLY,ok:take>=MONTHLY});
  });
  if(pool>0) lines.push({at:"prepaid",type:"Prepaid beyond this month",amount:pool,due:0,ok:true});
  return lines;
}

function filterStmt(id){
  const m=DB.members.find(x=>x.id==id); if(!m) return;
  const a=(document.getElementById("stFrom")||{}).value||"";
  const b=(document.getElementById("stTo")||{}).value||"";
  let lines=memberLines(m);
  lines=lines.filter(t=>{
    const d=String(t.at||"");
    if(a && d < a.slice(0,7) && d.length>=7) return false;
    if(b && d > b.slice(0,7) && d.length>=7) return false;
    if(a && d.length>=10 && d<a) return false;
    if(b && d.length>=10 && d>b) return false;
    return true;
  });
  const box=document.getElementById("stRows");
  if(!box){ alert("Open the statement first"); return; }
  box.innerHTML=`<table><thead><tr><th>Month</th><th>Expected</th><th>Applied</th><th>Status</th></tr></thead><tbody>`+
    lines.map(r=>`<tr><td>${esc(r.type)}</td><td>${r.due!=null?ugx(r.due):"—"}</td><td>${ugx(r.amount)}</td><td>${r.ok?"Cleared":"Due"}</td></tr>`).join("")+

}

  if(["vice","vice chair","vice chairman","vice chairperson"].includes(r)) return "vice chairperson";

function liveDayLabel(iso){
  const d=new Date(iso||Date.now());
  const today=new Date(); today.setHours(0,0,0,0);
  const that=new Date(d); that.setHours(0,0,0,0);
  const diff=Math.round((today-that)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short", year:"numeric"});
}

function pushLiveMsg(extra){
  const c=chatCtl();
  if(!canPostLive()){ alert("The treasurer has limited who can send."); return; }
  const now=Date.now();
  if(c.slowSec && window._lastLive && now-window._lastLive<c.slowSec*1000){
    alert("Slow mode: wait "+c.slowSec+" seconds"); return;
  }
  window._lastLive=now;
  const text=((document.getElementById("liveText")||{}).value||"").trim();
  const rec=Object.assign({
    id:"l"+now.toString(36)+Math.random().toString(36).slice(2,5),
    from:liveMe(),
    text:text,
    at:new Date().toISOString(),
    replyTo:window._liveReply||"",
    reactions:{},
    pinned:false,
    kind:"text", status:"sent", seenBy:[]
  }, extra||{});
  if(!rec.text && !rec.data){ alert("Write a message or attach something"); return; }
  if(rec.text && rec.text.length>(c.maxLen||500)){ alert("Keep the message under "+c.maxLen+" characters"); return; }
  DB.live=DB.live||[];
  DB.live.push(rec);
  const box=document.getElementById("liveText"); if(box) box.value="";
  window._liveReply=""; window._typingTo=""; window._typingAt=0;
  save(); render();
  setTimeout(()=>{ const s=document.getElementById("liveStream"); if(s) s.scrollTop=s.scrollHeight; },30);
}
function livePickFile(ev,kind){
  const f=ev.target.files && ev.target.files[0];
  ev.target.value="";
  if(!f) return;
  const c=chatCtl();
  if(kind==="photo" && !(c.allowPhoto||c.allowCamera)) return;
  if(kind==="video" && !c.allowVideo) return;
  if(kind==="file" && !c.allowFile) return;
  const cap=liveCap();
  if(kind==="photo" || (f.type||"").indexOf("image/")===0){
    compressLiveImage(f, cap).then(data=>pushLiveMsg({kind:"photo", data, mime:"image/jpeg", fileName:f.name||"photo.jpg"})).catch(e=>alert(e.message||e));
    return;
  }
  if(f.size>cap){ alert("That file is larger than "+Math.round(cap/1024)+" KB. Treasurer limit."); return; }
  const r=new FileReader();
  r.onload=()=>pushLiveMsg({kind:kind==="video"||(f.type||"").indexOf("video/")===0?"video":"file", data:r.result, mime:f.type||"application/octet-stream", fileName:f.name||"file"});
  r.readAsDataURL(f);
}
function compressLiveImage(file, cap){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height, max=960;
      if(w>max || h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q=0.72, data=cv.toDataURL("image/jpeg",q);
      while(data.length>cap*1.37 && q>0.35){ q-=0.08; data=cv.toDataURL("image/jpeg",q); }
      if(data.length>cap*1.37) reject(new Error("Photo is still too large after compress. Lower the treasurer KB limit only if needed."));
      else resolve(data);
    };
    img.onerror=()=>reject(new Error("Could not read photo"));
    img.src=url;
  });
}
function toggleLiveMic(){
  const c=chatCtl();
  if(!c.allowAudio) return;
  if(window._micRec){ stopLiveMic(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert("This phone cannot record audio here"); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const rec=new MediaRecorder(stream);
    const chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      stream.getTracks().forEach(tr=>tr.stop());
      const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
      if(blob.size>liveCap()){ alert("Voice note is over the treasurer size limit"); return; }
      const r=new FileReader();
      r.onload=()=>pushLiveMsg({kind:"audio", data:r.result, mime:blob.type, fileName:"voice-note.webm"});
      r.readAsDataURL(blob);
    };
    window._micRec=rec; rec.start();
    const btn=document.getElementById("liveMic"); if(btn){ btn.classList.add("rec-on"); btn.textContent="■"; }
    window._micT=setTimeout(stopLiveMic, 45000);
  }).catch(()=>alert("Allow the microphone to send a voice note"));
}

  try{ if(window._micT) clearTimeout(window._micT); }catch(e){}

function jsPdfCtor(){
  return (window.jspdf && window.jspdf.jsPDF) || window.jsPDF || null;
}

function fitFlyerOnOnePage(canvas, name){
  const JsPDF=jsPdfCtor();
  if(!JsPDF){
    if(typeof html2pdf==="undefined"){ alert("PDF tool did not load. Refresh the page once."); return; }
    const node=document.getElementById("flyer");
    html2pdf().set({
      margin:6,
      filename:name,
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,backgroundColor:"#f5c400"},
      jsPDF:{unit:"mm",format:"a4",orientation:"landscape"},
      pagebreak:{mode:[]}
    }).from(node).outputPdf("blob").then(blob=>openFile(blob,name));
    return;
  }
  const pdf=new JsPDF({orientation:"landscape", unit:"mm", format:"a4", compress:true});
  const pw=pdf.internal.pageSize.getWidth();
  const ph=pdf.internal.pageSize.getHeight();
  const pad=6;
  const maxW=pw-pad*2, maxH=ph-pad*2;
  let w=maxW, h=w*(canvas.height/canvas.width);
  if(h>maxH){ h=maxH; w=h*(canvas.width/canvas.height); }
  pdf.addImage(canvas.toDataURL("image/jpeg",0.95), "JPEG", (pw-w)/2, (ph-h)/2, w, h, "flyer", "FAST");
  openFile(pdf.output("blob"), name);
}

function grabFlyerCanvas(el){
  const opts={scale:2, backgroundColor:"#f5c400", useCORS:true, scrollX:0, scrollY:0, logging:false};
  if(window.html2canvas) return window.html2canvas(el, opts);
  if(typeof html2pdf!=="undefined") return html2pdf().set({html2canvas:opts}).from(el).toCanvas().get("canvas");
  return Promise.reject(new Error("no canvas tool"));
}

function downloadFlyer(){
  const node=document.getElementById("flyer");
  if(!node){ alert("Open Flyer first"); return; }
  const name="MUST-2017-flyer-"+new Date().toISOString().slice(0,10)+".pdf";
  if(!window.html2canvas && typeof html2pdf==="undefined" && !jsPdfCtor()){
    alert("Wait for the page to finish loading, then tap Save as PDF again"); return;
  }
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-1800px;top:0;width:1100px;background:#f5c400;padding:8px;";
  const clone=node.cloneNode(true);
  clone.id="flyerShot";
  clone.style.width="1084px";
  host.appendChild(clone);
  document.body.appendChild(host);
  Promise.resolve(grabFlyerCanvas(clone)).then(canvas=>{
    host.remove();
    fitFlyerOnOnePage(canvas, name);
  }).catch(err=>{
    host.remove();
    console.error(err);
    if(typeof html2pdf!=="undefined"){
      html2pdf().set({
        margin:6, filename:name,
        html2canvas:{scale:2,backgroundColor:"#f5c400"},
        jsPDF:{unit:"mm",format:"a4",orientation:"landscape"}
      }).from(node).outputPdf("blob").then(blob=>openFile(blob,name));
      return;
    }
    alert("Could not build the flyer PDF. Refresh and try again.");
  });
}

function importExcel(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(!needPin()) return;
  if(typeof XLSX==="undefined"){ alert("Excel reader did not load. Check internet once, then retry."); return; }
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    let added=0, updated=0;
    rows.forEach(row=>{
      const raw=String(row[0]||"").replace(/^\s*\d+\.\s*/,"").trim();
      if(!raw || /name|grand total|mbarara|item/i.test(raw)) return;
      const fee=Number(row[1]||0)||0;
      const status=row[2];
      const active=status===true || String(status).toUpperCase()==="TRUE" || fee>0;
      let paid=Number(row[15]||0);
      if(!paid){
        paid=0;
        for(let i=3;i<=14;i++) paid+=Number(row[i]||0)||0;
      }
      const phone=String(row[17]||"").replace(/\D/g,"");
      const role=String(row[18]||"Member").trim()||"Member";
      const existing=DB.members.find(m=>m.name.toLowerCase()===raw.toLowerCase());
      if(existing){
        existing.fee=fee; existing.active=active; existing.paid=paid;
        if(phone) existing.phone=phone.startsWith("256")?phone:("256"+phone);
        if(role) existing.role=role;
        updated++;
      } else {
        const id=DB.members.reduce((n,m)=>Math.max(n,m.id||0),0)+1;
        const ph=phone?(phone.startsWith("256")?phone:"256"+phone):"";
        DB.members.push({id,name:raw,fee,active,paid,phone:ph,role,months:{},tx:[{type:"Imported from Excel",amount:paid,at:new Date().toISOString()}]});
        added++;
      }
    });
    save(); alert("Excel sync: "+added+" added, "+updated+" updated"); render();
  };
  r.readAsArrayBuffer(f);
}
function importBackup(ev){

function ensureDocs(){
  DB.settings=DB.settings||defaultSettings();

  (DB.settings.payMethods||[]).forEach(p=>{
    if(PAY_CODES[p.id]) p.ussd=PAY_CODES[p.id];
    if(PAY_NOTES[p.id]) p.note=PAY_NOTES[p.id];
  });
  if(DB.settings.constitution==null) DB.settings.constitution=defaultSettings().constitution;
  if(DB.settings.activities==null) DB.settings.activities="";
  if(!DB.settings.bankFiles) DB.settings.bankFiles=[];
  if(!DB.settings.chatCtl) DB.settings.chatCtl={on:true,ttlHours:168,who:"members",react:true,reply:true,deleteOwn:true,slowSec:0,maxLen:500,showTyping:true,allowPhoto:true,allowCamera:true,allowVideo:true,allowAudio:true,allowFile:true,maxMediaKb:250,receipts:true,star:true,fwd:true};

}

function copyText(v){
  v=String(v||"");
  const go=()=>alert("Copied: "+v);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(go).catch(fallback);
  } else fallback();
  function fallback(){
    try{ const i=document.createElement("input"); i.value=v; document.body.appendChild(i); i.select(); document.execCommand("copy"); i.remove(); go(); }
    catch(e){ prompt("Copy this", v); }
  }
}
function openCal(id){
  const el=document.getElementById(id); if(!el) return;
  el.focus();
  if(el.showPicker) try{ el.showPicker(); }catch(e){}
}
function exactPayCode(id){
  if(PAY_CODES[id]) return PAY_CODES[id];
  const p=(DB.settings.payMethods||[]).find(x=>x.id===id)||{};
  return String(p.ussd||"").trim();
}
function copyPayCode(id){
  const box=document.getElementById("payCodeBox");
  const code=(box && box.value) ? box.value : exactPayCode(id);
  copyText(code);
}
function openPay(id){
  ensureDocs();
  const p=(DB.settings.payMethods||[]).find(x=>x.id===id); if(!p) return;
  const code=exactPayCode(id);
  const note=PAY_NOTES[id]||p.note||"";
  const msg="MUST 2017 Trust Fund payment via "+p.name+"\n"+code+"\nAccount "+BANK;
  openModal(`<h3>${esc(p.name)}</h3>
    ${payLogoSrc(p)?`<p><img alt="" src="${payLogoSrc(p)}" style="height:40px"/></p>`:""}
    <label>Code to copy</label>
    <p style="font-size:1.25rem;font-weight:800;letter-spacing:.04em;margin:4px 0">${code.indexOf("*")===0?`<a href="tel:${String(code).replace(/#/g,"%23")}" style="color:inherit;text-decoration:none">${esc(code)}</a>`:esc(code)}</p>
    <div class="row"><input id="payCodeBox" value="${code.replace(/"/g,'')}" readonly/><button class="btn ghost" type="button" onclick="copyPayCode('${p.id}')">⧉ copy exact</button>
      ${code.indexOf("*")===0?`<a class="btn gold" href="tel:${String(code).replace(/#/g,"%23")}">Dial</a>`:""}</div>

function saveConstitution(){ if(!needPin())return; ensureDocs(); DB.settings.constitution=document.getElementById("conEdit").value; save(); alert("Saved"); render(); }

function uploadBank(ev){
  if(!needPin()) return;
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ ensureDocs(); DB.settings.bankFiles.push({name:f.name,data:r.result,at:new Date().toISOString(),seen:true}); save(); render(); };
  r.readAsDataURL(f);

function toggleBank(i){ if(!needPin())return; ensureDocs(); DB.settings.bankFiles[i].seen=DB.settings.bankFiles[i].seen===false; save(); render(); }

function editExp(i){

function saveExp(i){

function delExp(i){
  if(!needPin()) return;
  if(!confirm("Remove this expense?")) return;
  DB.expenses.splice(i,1); save(); render();
}
function usedCodes(){ return new Set((DB.members||[]).map(m=>(m.code||"").toUpperCase()).filter(Boolean)); }
function genMemberCode(avoid){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const used=usedCodes();
  if(avoid) used.add(String(avoid).toUpperCase());
  for(let n=0;n<80;n++){
    let s="";
    for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    if(!used.has(s)) return s;
  }
  return String(Date.now()).slice(-5);
}
function assignCode(m,reshuffle){
  if(!m) return "";
  const prev=m.code||"";
  if(!reshuffle && prev) return prev;
  m.code=genMemberCode(prev);
  m.prevCode=prev||"";
  return m.code;
}
function newCodeFor(id){
  if(!needPin()) return;
  const m=DB.members.find(x=>x.id==id); if(!m) return;
  assignCode(m,true);
  save();
  alert(m.name+" new code: "+m.code);
  render();
}
function shareCode(id){
  const m=DB.members.find(x=>x.id==id); if(!m) return;
  if(!m.code) assignCode(m,false);

function bootCine(){
  const v=document.getElementById("cineVid");
  const still=document.querySelector(".cine-still");
  if(!v) return;
  const on=()=>{ v.classList.add("is-on"); if(still) still.classList.add("is-dim"); };
  const off=()=>{ v.classList.remove("is-on"); if(still) still.classList.remove("is-dim"); };
  v.muted=true; v.defaultMuted=true; v.playsInline=true; v.loop=true;
  v.addEventListener("playing", on);
  v.addEventListener("canplay", ()=>{ v.play().then(on).catch(()=>{}); });
  v.addEventListener("error", off);
  const tryPlay=()=>{ v.muted=true; const p=v.play(); if(p&&p.then) p.then(on).catch(()=>{}); };
  tryPlay();
  document.addEventListener("click", tryPlay);
  document.addEventListener("touchstart", tryPlay, {passive:true});
}
