<style>
:root{
  --bg:#0b0b0b; --panel:#141414; --card:#1a1a1a; --line:#2a2a2a;
  --gold:#d4af37; --gold2:#f3e2a5; --ink:#f6f1e4; --muted:#9a927f;
  --green:#3dd68c; --green-dim:#163526; --red:#ff6b5a; --red-dim:#3a1612;
  --amber:#f5c15c; --amber-dim:#3a2e12; --teal:#25d366;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Cormorant Garamond",Georgia,serif}
.app{max-width:1180px;margin:0 auto;padding:18px 16px 72px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:18px 20px;background:
  radial-gradient(800px 200px at 10% -20%, rgba(212,175,55,.18), transparent),
  linear-gradient(180deg,#161616,#101010);border:1px solid #2c2618;border-radius:22px}
.crest{width:78px;height:78px;flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:#161616;border:1px solid #3a3322;border-radius:16px;padding:16px;max-width:720px;width:100%;max-height:86vh;overflow:auto}
.chart{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin:4px 0}
.dot{width:10px;height:10px;border-radius:50%}
.photo{width:72px;height:72px;border-radius:12px;object-fit:cover;border:2px solid var(--gold);background:#111}
.flyer-wrap{background:#f5c400;padding:14px}
.flyer{background:#0a0a0a;color:#fff;border:3px solid #d4af37;padding:14px 12px;font-size:1rem}
.flyer h2{margin:0;text-align:center;color:#f5c400;font-size:1.5rem;letter-spacing:.06em}
.flyer .sub{text-align:center;color:#eee;margin:4px 0 8px;font-size:1rem}
.flyer .email-pill{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:4px 12px;font-size:.95rem}
.flyer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flyer table{width:100%;border-collapse:collapse;background:#f5e6a8;color:#111}
.flyer th{background:#111;color:#fff;font-size:.85rem;padding:7px 8px}
.flyer td{padding:6px 8px;border-bottom:1px solid #e0d08a;font-size:.95rem;font-weight:700}
.flyer .bar{background:#111;color:#f5c400;text-align:center;padding:10px;margin-top:8px;font-weight:700;font-size:1rem}
.flyer .legend-box{background:#fff;color:#111;padding:10px;margin-top:8px;font-size:.9rem}
.brand h1{margin:0;font-size:clamp(1.35rem,3vw,2rem);color:var(--gold2);letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.mode{display:flex;background:#000;border:1px solid #333;border-radius:999px;overflow:hidden}
.mode button{border:0;background:transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer}
.mode button.on{background:var(--gold);color:#111;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:1.25rem;color:var(--gold2)}
.stat span{color:var(--muted);font-size:.75rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.nav button,.btn{border:1px solid #3a3322;background:#1c1c1c;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.nav button.on,.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.btn.ghost{background:transparent}
.btn.wa{background:#128C7E;border-color:#128C7E;color:#fff;text-decoration:none;display:inline-block}
.btn.danger{background:var(--red);border-color:var(--red);color:#111;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 10px;color:var(--gold2)}
label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.ok{background:var(--green-dim);color:var(--green)}
.wait{background:var(--amber-dim);color:var(--amber)}
.no{background:var(--red-dim);color:var(--red)}
.offp{background:#222;color:#888}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:.9rem;vertical-align:top}
th{color:var(--gold);font-weight:600;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
.progress{height:8px;background:#2a2a2a;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.chatlog{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bubble{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
.bubble.official{border-color:#3a3322}
.bubble small{color:var(--muted)}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.officials{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.off-card{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:12px}
.off-card b{display:block;color:var(--gold2)}
.flyer-wrap{background:#111;padding:10px}
.best{background:#3a2e12;color:#f3e2a5;text-align:center;padding:8px;margin:8px 0;font-weight:700;border:1px solid #d4af37}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--gold);background:#1a1408;border-radius:10px;padding:10px 0;margin-top:12px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite;color:var(--gold2);font-weight:700;font-size:.95rem}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.hero{display:none;grid-template-columns:1fr 160px;gap:12px;align-items:center;margin:12px 0}
.hero.show{display:grid}
@media(max-width:800px){
  .hero.show{grid-template-columns:1fr 120px}
}
.money-slide{position:relative;min-height:92px}
.money-slide .stat{display:none}
.money-slide .stat.on{display:block}
#heroPie svg path{opacity:.28;transition:opacity .4s}
#heroPie svg path.hot{opacity:1}
.credits{height:220px;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:10px}
.credits-inner{animation:roll 18s linear infinite}
.credits table{margin:0}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.gate{min-height:70vh;display:grid;place-items:center;padding:24px}
.gate-box{width:min(460px,100%);background:var(--panel);border:1px solid #2c2618;border-radius:24px;padding:28px;text-align:center}
.hidden{display:none}
footer{text-align:center;color:#6e6758;font-size:.78rem;margin-top:18px}
@media(max-width:800px){
  .stats{grid-template-columns:1fr}
  .flyer-grid{grid-template-columns:1fr 1fr}
}
@media print{
  .noprint,.top .mode,.nav,footer,.stats{display:none!important}
  body,.app{background:#fff;color:#000;padding:0;margin:0}
  .flyer-wrap{background:#fff;padding:0}
  .flyer{page-break-inside:avoid}
}
</style>
</head>

function monthsBetween(from, to){
  return (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth()) + 1;
}
function billThroughDate(now){
  const s=DB.settings||defaultSettings();
  if(s.paused && s.pauseFrom){
    const p=new Date(s.pauseFrom+"T00:00:00");
    if(p<now) return p;
  }
  return now;
}
function monthsElapsed(now){ return Math.max(0, monthsBetween(START, now||new Date())); }
function classify(m, now){
  now=now||new Date();
  const elapsed=monthsElapsed(now);
  const expectedNow=elapsed*MONTHLY;
  const paid=Number(m.paid||0);
  const remaining=Math.max(0, expectedNow-paid);
  const prepaid=Math.max(0, paid-expectedNow);
  const monthsBehind=Math.ceil(remaining/MONTHLY);
  const monthsAhead=Math.floor(prepaid/MONTHLY);
  if(!m.active) return {code:"inactive",label:"Not registered",remaining:expectedNow,monthsBehind:elapsed,expectedNow,prepaid:0,monthsAhead:0};
  if(remaining<=0) return {code:"ok",label:monthsAhead?("Entitled · prepaid "+monthsAhead+" mo"):"Entitled · up to date",remaining:0,monthsBehind:0,expectedNow,prepaid,monthsAhead};
  if(monthsBehind<=GRACE) return {code:"wait",label:"Entitled · in grace",remaining,monthsBehind,expectedNow,prepaid:0,monthsAhead:0};
  return {code:"no",label:"Not entitled",remaining,monthsBehind,expectedNow,prepaid:0,monthsAhead:0};
}
function ugx(n){ return Number(n||0).toLocaleString("en-UG"); }
function wa(phone,text){
  if(!phone) return "";
  return "https://wa.me/"+String(phone).replace(/\D/g,"")+"?text="+encodeURIComponent(text||"");
}
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function tagMsg(t){
  t=(t||"").toLowerCase();
  if(/pay|balanc|contribut|ugx|behind|clear|remain/.test(t)) return "payment";
  if(/benefit|burial|wedding|entitle|funeral/.test(t)) return "benefit";
  if(/complain|not recorded|missing|wrong|delay|late/.test(t)) return "complaint";
  return "social";
}

function pieSvg(collected,spent,due){
  const t=Math.max(1,collected+spent+due);
  const a1=collected/t, a2=spent/t, a3=due/t;
  function arc(start,frac,color){
    const s=start*2*Math.PI-Math.PI/2, e=(start+frac)*2*Math.PI-Math.PI/2;
    const x1=50+40*Math.cos(s), y1=50+40*Math.sin(s);
    const x2=50+40*Math.cos(e), y2=50+40*Math.sin(e);
    const large=frac>0.5?1:0;
    return `<path d="M50 50 L${x1} ${y1} A40 40 0 ${large} 1 ${x2} ${y2} Z" fill="${color}"/>`;
  }
  return `<div class="chart"><svg width="120" height="120" viewBox="0 0 100 100">${arc(0,a1,"#d4af37")}${arc(a1,a2,"#ff6b5a")}${arc(a1+a2,a3,"#3dd68c")}</svg>
    <div class="legend">
      <span><i class="dot" style="background:#d4af37"></i> Collected ${ugx(collected)}</span>
      <span><i class="dot" style="background:#ff6b5a"></i> Spent ${ugx(spent)}</span>
      <span><i class="dot" style="background:#3dd68c"></i> Still to collect ${ugx(due)}</span>
    </div></div>`;
}
function miniPie(collected,due,spent,bal){
  const parts=[
    {v:Math.max(0,collected),c:"#d4af37"},
    {v:Math.max(0,due),c:"#3dd68c"},
    {v:Math.max(0,spent),c:"#ff6b5a"},
    {v:Math.max(0,bal),c:"#60a5fa"}
  ];
  const t=parts.reduce((s,p)=>s+p.v,0)||1;
  let a=0, d="";
  parts.forEach((p,i)=>{
    const f=p.v/t, s=a*2*Math.PI-Math.PI/2, e=(a+f)*2*Math.PI-Math.PI/2;
    const x1=50+40*Math.cos(s), y1=50+40*Math.sin(s);
    const x2=50+40*Math.cos(e), y2=50+40*Math.sin(e);
    d+=`<path class="${i===0?'hot':''}" data-i="${i}" d="M50 50 L${x1} ${y1} A40 40 0 ${f>0.5?1:0} 1 ${x2} ${y2} Z" fill="${p.c}"/>`;
    a+=f;
  });
  const pcts=parts.map(p=>Math.round(p.v/t*100));
  window._piePcts=pcts;
  return `<svg width="130" height="130" viewBox="0 0 100 100">${d}<circle cx="50" cy="50" r="22" fill="#0b0b0b"/>
    <text id="piePct" x="50" y="53" text-anchor="middle" fill="#f3e2a5" font-size="10" font-weight="700">${pcts[0]}%</text></svg>`;
}
function startMoneySlide(){
  if(window._moneyTimer) return;
  window._moneyI=0;
  window._moneyTimer=setInterval(()=>{
    const cards=document.querySelectorAll(".money-slide .stat");
    if(!cards.length) return;
    cards.forEach(c=>c.classList.remove("on"));
    window._moneyI=(window._moneyI+1)%cards.length;
    cards[window._moneyI].classList.add("on");
    document.querySelectorAll("#heroPie path").forEach(p=>{
      p.classList.toggle("hot", Number(p.getAttribute("data-i"))===window._moneyI);
    });
    const lab=document.getElementById("piePct");
    if(lab && window._piePcts) lab.textContent=(window._piePcts[window._moneyI]||0)+"%";
  },2000);
}

function liveSearch(q){
  window._q=q;
  const box=document.getElementById("addBox");
  if(box) box.style.display=q.trim()?"none":"";
  const rows=document.querySelectorAll("#regBody tr");
  const qq=q.toLowerCase();
  rows.forEach(tr=>{
    const name=(tr.children[1]&&tr.children[1].textContent||"").toLowerCase();
    tr.style.display=name.includes(qq)?"":"none";
  });
}
function deleteMember(id){
  if(!needPin()) return;
  const m=DB.members.find(x=>x.id===id); if(!m) return;
  if(!confirm("Delete "+m.name+" from the register? This cannot be undone unless you import a backup.")) return;
  DB.members=DB.members.filter(x=>x.id!==id);
  save(); render();
}
function fillEdit(id){
  const m=DB.members.find(x=>x.id===id); if(!m) return;
  document.getElementById("edName").value=m.name;
  document.getElementById("edPhone").value=m.phone||"";
  document.getElementById("edRole").value=m.role||"Member";
  document.getElementById("edFee").value=m.fee||0;
  document.getElementById("edPaid").value=m.paid||0;

}
function saveMember(update){
  if(!needPin()) return;
  const name=(document.getElementById("edName").value||"").trim();
  if(!name){ alert("Name required"); return; }
  const phone=(document.getElementById("edPhone").value||"").replace(/\D/g,"");
  const role=document.getElementById("edRole").value||"Member";
  const fee=Number(document.getElementById("edFee").value||0);
  const paid=Number(document.getElementById("edPaid").value||0);
  const existing=DB.members.find(m=>m.name.toLowerCase()===name.toLowerCase());
  if(update){
    if(!existing){ alert("No member with that name"); return; }
    existing.phone=phone; existing.role=role; existing.fee=fee; existing.paid=paid;
    existing.active=fee>0; existing.tx=existing.tx||[];
    existing.tx.push({type:"Updated by treasurer",amount:paid,at:new Date().toISOString()});
  } else {
    if(existing){ alert("Name already exists — use Update"); return; }
    const id=DB.members.reduce((n,m)=>Math.max(n,m.id||0),0)+1;
    DB.members.push({id,name,phone,role,fee,paid,active:fee>0,months:{},tx:[{type:"Added by treasurer",amount:paid,at:new Date().toISOString()}]});
  }
  save(); render();
}

function openFile(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; a.target="_blank"; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  const w=window.open(url,"_blank");
  if(!w){
    const viewer=window.open("","fileview");
    if(viewer) viewer.location.href=url;
    else location.href=url;
  }
}
function htmlToOpen(html, filename){
  const pdfName=filename.replace(/\.html$/i,".pdf");
  if(typeof html2pdf!=="undefined"){
    const wrap=document.createElement("div");
    wrap.innerHTML=html;
    wrap.style.cssText="position:fixed;left:-9999px;top:0;background:#fff;color:#111;padding:16px;width:700px";
    document.body.appendChild(wrap);
    html2pdf().set({
      margin:10, filename:pdfName,
      image:{type:"jpeg",quality:0.98},
      html2canvas:{scale:2,backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
    }).from(wrap).outputPdf("blob").then(blob=>{
      wrap.remove(); openFile(blob, pdfName);
    }).catch(()=>{ wrap.remove(); openFile(new Blob([html],{type:"text/html"}), filename); });
  } else openFile(new Blob([html],{type:"text/html"}), filename);
}

function filterStmt(id){
  const m=DB.members.find(x=>x.id===id);
  const a=document.getElementById("stFrom").value, b=document.getElementById("stTo").value;
  const rows=(m.tx||[]).filter(t=>{
    const d=String(t.at).slice(0,10);
    if(a&&d<a) return false;
    if(b&&d>b) return false;
    return true;
  });
  document.getElementById("stRows").innerHTML=`<table><thead><tr><th>When</th><th>Note</th><th>Amount</th></tr></thead>
    <tbody>${rows.map(t=>`<tr><td>${esc(t.at).slice(0,16)}</td><td>${esc(t.type)}</td><td>${ugx(t.amount)}</td></tr>`).join("")||"<tr><td colspan=3>None in this period</td></tr>"}</tbody></table>`;
}
function showFamily(id){
  const m=DB.members.find(x=>x.id===id); const p=m.profile||{};
  openModal(`<h3>${esc(m.name)}</h3>${m.photo?`<img class="photo" src="${m.photo}"/>`:""}
    <p>Spouse: ${esc(p.spouse||"—")}</p><p>Parents: ${esc(p.parents||"—")}</p><p>Siblings: ${esc(p.siblings||"—")}</p>
    <p>Phones: ${esc(m.phone||"—")} · ${esc(p.phone2||"—")}</p>`);

function payView(){
  const names=DB.members.filter(m=>m.active).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");
  return `<div class="card">
    <h3>Record money</h3>
    <label>Member</label><select id="payId">${names}</select>
    <label>Amount (UGX)</label><input id="payAmt" type="number" value="10000"/>
    <label>Note</label><input id="payNote" value="Monthly contribution"/>
    <div class="row" style="margin-top:10px">
      <button class="btn gold" onclick="doPay(1,'Payment')">Add payment</button>
      <button class="btn ghost" onclick="doPay(-1,'Reduction')">Reduce payment</button>
      <button class="btn ghost" onclick="doPay(-1,'Correction')">Correct entry</button>
    </div>
  </div>`;
}
function doPay(sign,kind){
  if(!needPin()) return;
  const id=Number(document.getElementById("payId").value);
  const amt=Number(document.getElementById("payAmt").value||0);
  const note=document.getElementById("payNote").value|| kind || (sign>0?"Payment":"Correction");
  if(amt<=0){ alert("Enter amount"); return; }
  const m=DB.members.find(x=>x.id===id);
  m.paid=Math.max(0,(m.paid||0)+sign*amt);
  m.tx=m.tx||[];
  m.tx.push({type:note,amount:sign*amt,at:new Date().toISOString()});
  save(); alert(m.name+" is now at "+ugx(m.paid)); render();
}

function visibleChat(isTreas){
  return DB.chat.filter(c=>{
    const kind=tagMsg(c.text);
    const secret=c.confidential || c.private || kind==="benefit" || c.to==="Treasurer";
    if(secret) return isTreas;
    return true;
  });
}
function chatView(isTreas){
  const summary=summarizeChat();
  return `${isTreas?`<div class="card"><h3>Digest for treasurer</h3>${summary}
    </div>`:""}
  <div class="card">
    <h3>Association room</h3>
    <label>Your name</label><input id="chatFrom" value="${esc(who)}" placeholder="Full name as on the register"/>
    <label>Message (public)</label><textarea id="chatText" rows="3" placeholder="Meetings and general notices only. Benefit requests go to Message treasurer."></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn gold" onclick="postChat()">Post publicly</button>
    </div>
  </div>
  <div class="card chatlog">${visibleChat(isTreas).slice().reverse().map(c=>`
    <div class="bubble ${c.role==='system'||c.private?'official':''}">
      <div class="tag">${esc(c.to||"Everyone")} · ${c.private||tagMsg(c.text)==="benefit"?"confidential":tagMsg(c.text)}</div>
      <b>${esc(c.from)}</b> <small>${new Date(c.at).toLocaleString()}</small>
      <div>${esc(c.text)}</div>
    </div>`).join("")}</div>`;
}
function summarizeChat(){
  const human=DB.chat.filter(c=>c.role!=="system");
  const bags={payment:0,benefit:0,complaint:0,social:0};
  human.forEach(c=>bags[tagMsg(c.text)]++);
  const flagged=human.filter(c=>tagMsg(c.text)!=="social").slice(-6).reverse();
  return `<p><b>${human.length}</b> member messages · payments ${bags.payment} · benefits ${bags.benefit} · complaints ${bags.complaint} · other ${bags.social}</p>
    ${flagged.map(c=>`<div>• <b>${esc(c.from)}</b> → ${esc(c.to)} <span class="pill wait">${tagMsg(c.text)}</span> ${esc(c.text)}</div>`).join("")||"<p>No flagged messages yet.</p>"}`;
}
function postChat(){
  const from=(document.getElementById("chatFrom").value||"").trim();
  const text=(document.getElementById("chatText").value||"").trim();
  if(!from||!text){ alert("Name and message required"); return; }
  const kind=tagMsg(text);
  if(kind==="benefit"){
    DB.chat.push({from,to:"Treasurer",text,at:new Date().toISOString(),role:"member",private:true,confidential:true});
    alert("Sent");
  } else {
    DB.chat.push({from,to:"Everyone",text,at:new Date().toISOString(),role:"member",private:false,confidential:false});
  }
  save(); render();
}

function expView(collected,spent){
  return `<div class="card">
    <h3>Money out</h3>
    <p>In ${ugx(collected)} · Out ${ugx(spent)} · Balance <b>${ugx(collected-spent)}</b></p>
    <label>Item</label><input id="exItem"/>
    <label>Amount</label><input id="exAmt" type="number"/>
    <label>C/O</label><input id="exBy"/>
    <button class="btn gold" style="margin-top:8px" onclick="addExp()">Add expense</button>
  </div>
  <div class="card" style="overflow:auto"><table><thead><tr><th>Date</th><th>Item</th><th>Amount</th><th>C/O</th></tr></thead>
  <tbody>${DB.expenses.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.item)}</td><td>${ugx(e.amount)}</td><td>${esc(e.by)}</td></tr>`).join("")}</tbody></table></div>`;
}
function addExp(){
  if(!needPin()) return;
  const item=document.getElementById("exItem").value.trim();
  const amount=Number(document.getElementById("exAmt").value||0);
  const by=document.getElementById("exBy").value.trim();
  if(!item||amount<=0){ alert("Need item and amount"); return; }
  DB.expenses.push({item,amount,by,date:new Date().toISOString().slice(0,10)});
  save(); render();
}

function flyerStamp(){ return new Date().toLocaleString(); }
function bestContributor(){
  const list=DB.members.filter(m=>m.active);
  if(!list.length) return null;
  return list.slice().sort((a,b)=>(b.paid||0)-(a.paid||0))[0];
}
function printFlyer(){

    </head><body>${node.outerHTML}<script>window.onload=function(){window.print();}<\/script></body></html>`);

  if(typeof html2pdf==="undefined"){ alert("Wait for the page to finish loading, then tap Save as PDF again"); return; }

  html2pdf().set({
    margin:4,
    filename:name,
    image:{type:"jpeg",quality:0.98},
    html2canvas:{scale:2,backgroundColor:"#f5c400",windowWidth:900},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
    pagebreak:{mode:["avoid-all"]}
  }).from(node).outputPdf("blob").then(blob=>openFile(blob, name));
}
function flyerView(st){
  const now=new Date();
  const elapsed=monthsElapsed(now);
  const expected=elapsed*MONTHLY;
  const list=DB.members.filter(m=>m.active).map(m=>{
    const c=classify(m,now);
    return {m,...c,remaining:Math.max(0, expected-Number(m.paid||0))};
  }).sort((a,b)=>a.remaining-b.remaining);
  const mid=Math.ceil(list.length/2);
  const due=list.reduce((s,x)=>s+x.remaining,0);
  const col=(arr,off)=>`
    <table><thead><tr><th>S/N</th><th>NAME</th><th>BALANCE (UGX)</th></tr></thead>
    <tbody>${arr.map((x,i)=>`<tr>
      <td>${off+i+1}</td>
      <td style="color:${x.code==='no'?'#b91c1c':(x.code==='ok'||x.code==='wait')?'#166534':'#111'}">${esc(x.m.name)}</td>
      <td>${Number(x.remaining).toLocaleString()}</td>
    </tr>`).join("")}</tbody></table>`;
  return `<div class="noprint row" style="margin-bottom:10px">
    <button class="btn gold" onclick="downloadFlyer()">Save as PDF</button>
    <button class="btn ghost" onclick="printFlyer()">Print flyer</button>
  </div>
  <div class="flyer-wrap"><div class="flyer" id="flyer">
    <h2>MUST GRADUATES 2017 TRUST FUND</h2>
    <div class="sub">Outstanding to ${now.toLocaleString("en-UG",{month:"long",year:"numeric"})} · ${elapsed} months × 10,000 = ${expected.toLocaleString()} expected<br>
    ${flyerStamp()}<br>
    <span class="email-pill">Email: ${EMAIL}</span></div>
    <div class="flyer-grid"><div>${col(list.slice(0,mid),0)}</div><div>${col(list.slice(mid),mid)}</div></div>
    <div class="bar">TOTAL MEMBERS: ${list.length} &nbsp;|&nbsp; TOTAL AMOUNT DUE: ${Number(due).toLocaleString()} UGX</div>
    <div class="legend-box">
      BENEFIT ENTITLEMENT STATUS:<br>
      Balance shown is up to this month (not reduced by grace).<br>
      <span style="color:#166534">GREEN NAMES — entitled (paid enough to be within 4-month grace).</span><br>
      <span style="color:#b91c1c">RED NAMES — not entitled (more than 4 months behind).</span>
    </div>
    <div class="bar">CLEAR YOUR BALANCE TO:<br>STANBIC BANK A/C ${BANK}</div>
  </div></div>`;
}

function exportExcel(){
  if(typeof XLSX==="undefined"){ alert("Excel tool needs internet once"); return; }
  const now=new Date();
  const head=["NAME","MEMBERSHIP FEE","STATUS","JAN","FEB","MAR","APR","MAY","JUNE","JUL","AUG","SEP","OCT","NOV","DEC","TOTAL CONTRIBUTED","REMAINING CONTRIBUTION","TEL. No.","ROLE"];
  const rows=[head];
  const labs=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  DB.members.forEach(m=>{
    const c=classify(m,now);
    const mo=m.months||{};
    rows.push([m.name,m.fee||0,!!m.active,...labs.map(k=>mo[k]||""),m.paid||0,c.remaining,m.phone||"",m.role||"Member"]);
  });
  rows.push(["GRAND TOTAL",DB.members.reduce((s,m)=>s+(m.fee||0),0),"","","","","","","","","","","","",DB.members.reduce((s,m)=>s+(m.paid||0),0),"","",""]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Members");
  const ex=[["ITEM/REASON","DATE","AMOUNT","C/O"]];
  DB.expenses.forEach(e=>ex.push([e.item,e.date,e.amount,e.by]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ex),"Expenditure");
  XLSX.writeFile(wb,"MUST-2017-Trust-Fund.xlsx");
}
function downloadBackup(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}));
  a.download="MUST-2017-Trust-Fund-backup.json"; a.click();
}
function importExcel(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(!needPin()) return;
  if(typeof XLSX==="undefined"){ alert("Excel reader did not load. Check internet once, then retry."); return; }
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    let added=0, updated=0;
    rows.forEach(row=>{
      const raw=String(row[0]||"").replace(/^\s*\d+\.\s*/,"").trim();
      if(!raw || /name|grand total|mbarara|item/i.test(raw)) return;
      const fee=Number(row[1]||0)||0;
      const status=row[2];
      const active=status===true || String(status).toUpperCase()==="TRUE" || fee>0;
      let paid=Number(row[15]||0);
      if(!paid){
        paid=0;
        for(let i=3;i<=14;i++) paid+=Number(row[i]||0)||0;
      }
      const phone=String(row[17]||"").replace(/\D/g,"");
      const role=String(row[18]||"Member").trim()||"Member";
      const existing=DB.members.find(m=>m.name.toLowerCase()===raw.toLowerCase());
      if(existing){
        existing.fee=fee; existing.active=active; existing.paid=paid;
        if(phone) existing.phone=phone.startsWith("256")?phone:("256"+phone);
        if(role) existing.role=role;
        updated++;
      } else {
        const id=DB.members.reduce((n,m)=>Math.max(n,m.id||0),0)+1;
        const ph=phone?(phone.startsWith("256")?phone:"256"+phone):"";
        DB.members.push({id,name:raw,fee,active,paid,phone:ph,role,months:{},tx:[{type:"Imported from Excel",amount:paid,at:new Date().toISOString()}]});
        added++;
      }
    });
    save(); alert("Excel sync: "+added+" added, "+updated+" updated"); render();
  };
  r.readAsArrayBuffer(f);
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ DB=JSON.parse(r.result); save(); alert("Imported"); render(); };
  r.readAsText(f);
}
function resetSeed(){
  if(!needPin()) return;
  if(!confirm("Replace live data with the original Excel snapshot?")) return;
  localStorage.removeItem(KEY); DB=seed(); save(); render();
}
function changePin(){
  if(!needPin()) return;
  const n=document.getElementById("newPin").value.trim();
  if(n.length<4){ alert("Use at least 4 characters"); return; }
  DB.pin=n; save(); alert("PIN changed");
}
if(location.hash.startsWith("#reset=")){
  const token=location.hash.slice(7);
  const rec=(DB.resets||[]).find(r=>r.token===token && !r.used);
  if(rec){
    const np=prompt("Set a new treasurer PIN");
    if(np && np.length>=4){ DB.pin=np; rec.used=true; save(); alert("PIN updated"); }
  }
}
render();
</script>
